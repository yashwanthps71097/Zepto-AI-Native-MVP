<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 850" width="400" height="850" style="background-color: #f3f5fa; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  
  <!-- Phone Frame & Screen Background -->
  <rect x="5" y="5" width="390" height="840" rx="40" fill="#f3f5fa" stroke="#cbd5e1" stroke-width="4"/>

  <!-- Status Bar -->
  <g transform="translate(0, 10)">
    <text x="35" y="25" fill="#0f172a" font-size="11" font-weight="700">11:26</text>
    <text x="365" y="25" fill="#0f172a" font-size="10" font-weight="700" text-anchor="end">VoLTE  77%</text>
  </g>

  <!-- Location Bar Header -->
  <g transform="translate(0, 45)">
    <rect x="5" y="0" width="390" height="45" fill="#ffffff"/>
    <circle cx="30" cy="22" r="12" fill="#f1f5f9"/>
    <text x="30" y="27" fill="#0f172a" font-size="16" font-weight="700" text-anchor="middle">‹</text>
    
    <text x="52" y="18" fill="#0f172a" font-size="13" font-weight="900">Other <tspan font-size="9" font-weight="400">∨</tspan></text>
    <text x="52" y="32" fill="#64748b" font-size="10">Bus stop, 2M5W+C2J, Old Madras Rd, Krishnara...</text>
    
    <circle cx="365" cy="22" r="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <text x="365" y="26" fill="#0f172a" font-size="11" text-anchor="middle">♡</text>
  </g>

  <!-- Savings Green Banner -->
  <g transform="translate(5, 90)">
    <rect x="0" y="0" width="390" height="28" fill="#e8faea"/>
    <text x="195" y="18" fill="#118822" font-size="11" font-weight="700" text-anchor="middle">Yay! You saved ₹13 on this order ∨</text>
  </g>

  <!-- Special Prices Offer Strip -->
  <g transform="translate(15, 128)">
    <rect x="0" y="0" width="370" height="42" rx="14" fill="#f3e8ff" stroke="#f0abfc" stroke-width="0.5"/>
    <circle cx="26" cy="21" r="11" fill="#e9d5ff"/>
    <text x="26" y="25" fill="#6b21a8" font-size="10" font-weight="800" text-anchor="middle">₹</text>
    <text x="48" y="25" fill="#581c87" font-size="12" font-weight="800">Special prices <tspan font-weight="400">for you on your</tspan> 1ˢᵗ order</text>
  </g>

  <!-- Coupons & Offers Card -->
  <g transform="translate(15, 180)">
    <rect x="0" y="0" width="370" height="110" rx="16" fill="#ffffff" stroke="#f1f5f9" stroke-width="1"/>
    
    <rect x="12" y="12" width="28" height="14" rx="3" fill="#007aff"/>
    <text x="26" y="22" fill="#ffffff" font-size="8" font-weight="900" text-anchor="middle">NEW</text>
    <text x="46" y="23" fill="#007aff" font-size="11" font-weight="700">Apply coupons + payment offers &amp; save more</text>
    
    <text x="12" y="44" fill="#0f172a" font-size="12" font-weight="800">Coupons &amp; offers</text>
    
    <!-- Row 1 -->
    <rect x="12" y="54" width="28" height="22" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="26" y="69" fill="#16a34a" font-size="10" text-anchor="middle">%</text>
    <text x="48" y="69" fill="#0f172a" font-size="11" font-weight="700">View coupons</text>
    <text x="350" y="69" fill="#94a3b8" font-size="12" font-weight="700">›</text>
    <line x1="12" y1="82" x2="358" y2="82" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="2,2"/>
    
    <!-- Row 2 -->
    <rect x="12" y="88" width="28" height="18" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="26" y="101" fill="#2563eb" font-size="9" text-anchor="middle">💳</text>
    <text x="48" y="101" fill="#0f172a" font-size="11" font-weight="700">View payment offers</text>
    <text x="350" y="101" fill="#94a3b8" font-size="12" font-weight="700">›</text>
  </g>

  <!-- Items & Delivery Card -->
  <g transform="translate(15, 300)">
    <rect x="0" y="0" width="370" height="130" rx="16" fill="#ffffff" stroke="#f1f5f9" stroke-width="1"/>
    
    <!-- Delivery SLA -->
    <circle cx="25" cy="22" r="10" fill="#ffffff" stroke="#64748b" stroke-width="1"/>
    <text x="25" y="26" fill="#0f172a" font-size="9" text-anchor="middle">🕒</text>
    <text x="42" y="21" fill="#0f172a" font-size="12" font-weight="800">Delivering in 6 mins</text>
    <text x="42" y="32" fill="#64748b" font-size="10">1 item</text>
    
    <rect x="265" y="12" width="90" height="24" rx="6" fill="#e2e8f0"/>
    <text x="310" y="28" fill="#94a3b8" font-size="10" font-weight="700" text-anchor="middle">📅 Schedule</text>

    <line x1="12" y1="42" x2="358" y2="42" stroke="#f1f5f9" stroke-width="1"/>

    <!-- Cart Item -->
    <rect x="12" y="50" width="40" height="40" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="32" y="75" font-size="20" text-anchor="middle">🥛</text>
    <text x="60" y="63" fill="#0f172a" font-size="11" font-weight="800">Godrej Jersey Full Cream Milk</text>
    <text x="60" y="77" fill="#64748b" font-size="10">1 pack (490 ml or 500 ml)</text>

    <!-- Qty Button -->
    <rect x="285" y="50" width="70" height="22" rx="6" fill="#fff0f4" stroke="#ffd6e0" stroke-width="1"/>
    <text x="320" y="65" fill="#ff3269" font-size="12" font-weight="900" text-anchor="middle">-   1   +</text>
    <text x="355" y="86" fill="#118822" font-size="11" font-weight="900" text-anchor="end">₹35 <tspan fill="#94a3b8" font-size="9" font-weight="400" text-decoration="line-through">₹38</tspan></text>

    <!-- Forgot Something Link -->
    <line x1="12" y1="98" x2="358" y2="98" stroke="#f1f5f9" stroke-width="1"/>
    <text x="185" y="116" fill="#0f172a" font-size="11" font-weight="700" text-anchor="middle">Forgot something? <tspan fill="#ff3269">Add More Items</tspan></text>
  </g>

  <!-- ========================================================= -->
  <!-- ✨ ZEPO AI SHOPPING COMPANION CARD (NATURAL EMBEDDED)     -->
  <!-- ========================================================= -->
  <g transform="translate(15, 440)">
    <rect x="0" y="0" width="370" height="150" rx="16" fill="url(#aiSoftGrad)" stroke="#e9d5ff" stroke-width="1.5"/>

    <!-- Header -->
    <rect x="12" y="10" width="18" height="18" rx="4" fill="#7e22ce"/>
    <text x="21" y="23" fill="#ffffff" font-size="10" text-anchor="middle">✨</text>
    <text x="36" y="23" fill="#6b21a8" font-size="11" font-weight="900" letter-spacing="0.5">AI SHOPPING COMPANION</text>
    
    <rect x="290" y="10" width="68" height="18" rx="9" fill="#f3e8ff" stroke="#e9d5ff" stroke-width="1"/>
    <text x="324" y="22" fill="#7e22ce" font-size="8" font-weight="900" text-anchor="middle">92% MATCH</text>

    <!-- Reason Box -->
    <rect x="12" y="34" width="346" height="42" rx="10" fill="#ffffff" stroke="#f3e8ff" stroke-width="1"/>
    <text x="20" y="48" fill="#334155" font-size="9.5" font-style="italic">"You buy milk and staples regularly. Customers with similar</text>
    <text x="20" y="60" fill="#334155" font-size="9.5" font-style="italic">habits also purchase <tspan font-weight="700" font-style="normal">Breakfast Cereals &amp; Muesli</tspan>."</text>
    <text x="20" y="72" fill="#7e22ce" font-size="8" font-weight="700">ⓘ Why am I seeing this?</text>
    <text x="350" y="72" fill="#94a3b8" font-size="8" text-anchor="end">Helpful? 👍  👎</text>

    <!-- Product Card -->
    <rect x="12" y="82" width="346" height="45" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="18" y="88" width="32" height="32" rx="6" fill="#faf5ff"/>
    <text x="34" y="110" font-size="18" text-anchor="middle">🥣</text>
    
    <rect x="56" y="88" width="68" height="11" rx="2" fill="#fef3c7"/>
    <text x="58" y="96" fill="#d97706" font-size="6.5" font-weight="900">NEW CATEGORY</text>
    
    <text x="56" y="108" fill="#0f172a" font-size="10" font-weight="800">Yoga Bar Dark Chocolate Muesli</text>
    <text x="56" y="120" fill="#64748b" font-size="9">1 pack (400 g) · <tspan fill="#0f172a" font-weight="800">₹299</tspan> <tspan font-size="8" text-decoration="line-through">₹349</tspan></text>

    <rect x="295" y="92" width="55" height="24" rx="6" fill="#118822"/>
    <text x="322.5" y="108" fill="#ffffff" font-size="10" font-weight="900" text-anchor="middle">+ ADD</text>

    <text x="185" y="141" fill="#94a3b8" font-size="9" font-weight="600" text-anchor="middle">Not Interested</text>
  </g>

  <!-- Bill Summary Card -->
  <g transform="translate(15, 600)">
    <rect x="0" y="0" width="370" height="115" rx="16" fill="#ffffff" stroke="#f1f5f9" stroke-width="1"/>
    
    <text x="15" y="22" fill="#0f172a" font-size="12" font-weight="800">📋 Bill Summary</text>
    
    <text x="15" y="44" fill="#64748b" font-size="11">Item Total</text>
    <text x="355" y="44" fill="#0f172a" font-size="11" font-weight="700" text-anchor="end"><tspan fill="#94a3b8" font-weight="400" text-decoration="line-through">₹38</tspan> ₹35</text>

    <text x="15" y="64" fill="#64748b" font-size="11">Delivery Fee</text>
    <text x="355" y="64" fill="#0f172a" font-size="11" font-weight="700" text-anchor="end">₹30</text>
    <text x="15" y="77" fill="#007aff" font-size="9.5">Free above ₹49 (Unlock by adding ₹14 more)</text>

    <text x="15" y="96" fill="#64748b" font-size="11">Handling Fee</text>
    <text x="355" y="96" fill="#118822" font-size="11" font-weight="800" text-anchor="end"><tspan fill="#94a3b8" font-weight="400" text-decoration="line-through">₹10</tspan> FREE</text>
  </g>

  <!-- Bottom Bar (Matching Screenshot) -->
  <g transform="translate(0, 770)">
    <rect x="5" y="0" width="390" height="70" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    
    <text x="20" y="24" fill="#64748b" font-size="10" font-weight="500">To Pay</text>
    <text x="20" y="46" fill="#0f172a" font-size="18" font-weight="900">₹65</text>

    <rect x="85" y="12" width="135" height="42" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="152.5" y="37" fill="#0f172a" font-size="11" font-weight="800" text-anchor="middle">Pay Online</text>

    <rect x="228" y="12" width="147" height="42" rx="12" fill="#ff3269"/>
    <text x="301.5" y="30" fill="#ffffff" font-size="11" font-weight="800" text-anchor="middle">Pay Cash/UPI</text>
    <text x="301.5" y="42" fill="#ffffff" font-size="8" font-weight="500" text-anchor="middle">(on delivery)</text>
  </g>

  <!-- Gradients -->
  <defs>
    <linearGradient id="aiSoftGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#faf5ff"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f3e8ff"/>
    </linearGradient>
  </defs>

</svg>
